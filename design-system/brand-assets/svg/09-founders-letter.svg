nt-weight:400">enim, elementum vitae lacinia ut, faucibus a magna. Ut placerat,</text><text x="22" y="87.19999999999999" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">dolor at tempus tincidunt, libero risus rutrum velit, a tempor</text><text x="22" y="92.8" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">velit nibh sed arcu.</text><text x="22" y="98.4" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400"></text><text x="22" y="104" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">Suspendisse potenti. Quisque pulvinar libero in semper lacinia.</text><text x="22" y="109.6" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">In vehicula, justo ut posuere viverra, urna risus pretium augue.</text><text x="22" y="115.19999999999999" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400"></text><text x="22" y="120.8" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">Sed at nibh nec velit lacinia hendrerit. Integer tempor lectus a</text><text x="22" y="126.39999999999999" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.4px;fill:#1F3A4D;font-weight:400">augue feugiat.</text><text x="22" y="180" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:3.6px;fill:#5A6B78;font-weight:400;f