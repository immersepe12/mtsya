nd&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:14px;fill:#1F3A4D;font-weight:400">hear from us again then, with the courier’s tracking number.</text><line x1="44" y1="309" x2="556" y2="309" stroke="#BFC4C9" stroke-width="1"></line><text x="44" y="333" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Order</text><text x="556" y="333" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">MT·2026·0473</text><text x="44" y="355" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Shirt</text><text x="556" y="355" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">Manu White · modern fit · M</text><text x="44" y="377" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Fabric</text><text x="556" y="377" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">60% Egyptian Giza, 40% TENCEL Lyocell</text><text x="44" y="399" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Quantity</text><text x="556" y="399" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">1</text><text x="44" y="421" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Shipping</text><text x="556" y="421" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">Free, in India</text><text x="44" y="443" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12px;fill:#5A6B78;font-weight:400">Payment</text><text x="556" y="443" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:12.5px;fill:#1F3A4D;font-weight:400">Card ending 4711</text><line x1="44" y1="469" x2="556" y2="469" stroke="#BFC4C9" stroke-width="1"></line><text x="44" y="491" text-anchor="start" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:13px;fill:#1F3A4D;font-weight:400">Total</text><text x="556" y="491" text-anchor="end" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:13px;fill:#1F3A4D;font-weight:400">₹3,000</text><line x1="44" y1="513" x2="556" y2="513" stroke="#BFC4C9" stroke-width="1"></line><text x="44" y="525" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:14px;fill:#1F3A4D;font-weight:400">Returns within 30 days, no questions, no need to explain.</text><text x="44" y="553" text-anchor="start" style="font-family:&#39;EB Garamond&#39;,&#39;Adobe Caslon Pro&#39;,Georgia,serif;font-size:14px;fill:#5A6B78;font-weight:400;font-style:italic">— Kushal</text><image x="287" y="583" width="26" height="26" preserveAspectRatio="xMidYMid meet"></image><line x1="44" y1="623" x2="556" y2="623" stroke="#BFC4C9" stroke-width="1"></line><text x="300" y="639" text-anchor="middle" style="font-family:&#39;Inter&#39;,&#39;Optima&#39;,&#39;Avenir&#39;,system-ui,sans-serif;font-size:10px;fill:#9DA8B2;font-weight:400;letter-spacing:1.4px">MTSYA.IN  ·  TIRUPPUR · INDIA</text>
