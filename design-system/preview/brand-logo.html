<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .card{display:flex;align-items:center;gap:48px;padding:24px 32px;height:200px;box-sizing:border-box;}
  .card img{height:152px;width:auto;}
  .meta{font-family:var(--font-ui);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-fg-2);line-height:1.6;}
  .meta b{display:block;font-family:var(--font-display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--color-fg);font-weight:400;margin-bottom:6px;}
  .deva{font-family:var(--font-deva);font-size:32px;color:var(--color-fg);margin-top:8px;letter-spacing:0;text-transform:none;}
</style></head>
<body>
  <div class="card">
    <img src="../assets/mtsya-logo.png" alt="mtsya">
    <div class="meta">
      <b>The fish + wordmark lockup</b>
      Madhubani-lineage fish in Deep Ink on Paper Cream.<br>
      The only graphic mark in the entire UI.
      <div class="deva">मत्स्य</div>
    </div>
  </div>
</body></html>
