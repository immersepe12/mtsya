<!doctype html>
<html><head><meta charset="utf-8"><title>Product palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:24px 32px;}
  .head{font-family:var(--font-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-fg-2);margin-bottom:14px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  .sw .chip{height:92px;border:1px solid rgba(31,58,77,.06);}
  .name{font-family:var(--font-display);font-size:18px;color:var(--color-fg);margin-top:10px;letter-spacing:0;}
  .meaning{font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--color-fg-2);margin-top:2px;}
  .hex{font-family:var(--font-ui);font-size:11px;letter-spacing:.1em;color:var(--color-fg-2);margin-top:4px;font-feature-settings:"lnum" 1;}
</style></head>
<body><div class="wrap">
<div class="head">Product palette · used only inside product photography · never UI</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#F4EFE5"></div><div class="name">Manu White</div><div class="meaning">the boat — what carries</div><div class="hex">#F4EFE5</div></div>
  <div class="sw"><div class="chip" style="background:#1B2A47"></div><div class="name">Deluge Indigo</div><div class="meaning">the night — when the rain came</div><div class="hex">#1B2A47</div></div>
  <div class="sw"><div class="chip" style="background:#EFE6D2"></div><div class="name">Veda Cream</div><div class="meaning">old paper — preserved</div><div class="hex">#EFE6D2</div></div>
  <div class="sw"><div class="chip" style="background:#B8BCB6"></div><div class="name">Tide Stone</div><div class="meaning">wet rock — the boat rested</div><div class="hex">#B8BCB6</div></div>
  <div class="sw"><div class="chip" style="background:#545A3D"></div><div class="name">Coast Olive</div><div class="meaning">dry land — life again</div><div class="hex">#545A3D</div></div>
</div></div></body></html>
