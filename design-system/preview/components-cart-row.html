<!doctype html>
<html><head><meta charset="utf-8"><title>Cart row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;}
  .row{display:grid;grid-template-columns:96px 1fr auto;gap:24px;align-items:flex-start;padding:18px 0;border-top:1px solid #BFC4C9;}
  .row:last-child{border-bottom:1px solid #BFC4C9;}
  .img{width:96px;height:120px;background:#F4EFE5;}
  .img.b{background:#1B2A47;}
  .name{font-family:var(--font-display);font-size:18px;color:var(--color-fg);margin:0 0 4px;}
  .meta{font-family:var(--font-ui);font-size:13px;color:var(--color-fg-2);letter-spacing:.02em;}
  .remove{font-family:var(--font-ui);font-size:12px;color:var(--color-fg-2);margin-top:10px;display:inline-block;text-decoration:underline;text-underline-offset:3px;}
  .price{font-family:var(--font-ui);font-size:16px;color:var(--color-fg);font-feature-settings:"lnum" 1;}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="img"></div>
    <div><div class="name">Manu White</div><div class="meta">modern · M</div><a class="remove">remove</a></div>
    <div class="price">₹3,000</div>
  </div>
  <div class="row">
    <div class="img b"></div>
    <div><div class="name">Deluge Indigo</div><div class="meta">slim · L</div><a class="remove">remove</a></div>
    <div class="price">₹3,000</div>
  </div>
</div></body></html>
