<!doctype html>
<!-- @dsCard group="Brand" name="Components · header" subtitle="80 px · wordmark left · 5 nav items right" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .head{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:80px;border-bottom:1px solid #BFC4C9;}
  .word{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.2em;color:var(--color-fg);}
  .nav{display:flex;gap:32px;}
  .nav a{font-family:var(--font-ui);font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--color-fg);text-decoration:none;}
  .scroll-meta{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-fg-2);padding:14px 40px;}
</style></head>
<body>
  <div class="head">
    <div class="word">mtsya</div>
    <nav class="nav">
      <a>shirts</a><a>tees</a><a>the story</a><a>journal</a><a>bag (1)</a>
    </nav>
  </div>
  <div class="scroll-meta">Single line · 80 px desktop · transparent on hero · Paper Cream after scroll · no dropdowns</div>
</body></html>
