<!doctype html>
<!-- @dsCard group="Brand" name="Components · fit + size pills" subtitle="Square · 1 px hairline → 2 px ink on select" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Pills</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;flex-direction:column;gap:10px;}
  .label{font-family:var(--font-ui);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-fg-2);}
  .pills{display:flex;gap:8px;}
  .pill{font-family:var(--font-ui);font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--color-fg);padding:10px 18px;border:1px solid #BFC4C9;background:transparent;cursor:pointer;}
  .pill.sel{border:2px solid #1F3A4D;padding:9px 17px;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="label">Fit</span><div class="pills">
    <button class="pill">Slim</button>
    <button class="pill sel">Modern</button>
    <button class="pill">Relaxed</button>
  </div></div>
  <div class="row"><span class="label">Size</span><div class="pills">
    <button class="pill">XS</button>
    <button class="pill">S</button>
    <button class="pill sel">M</button>
    <button class="pill">L</button>
    <button class="pill">XL</button>
  </div></div>
</div></body></html>
