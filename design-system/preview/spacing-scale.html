<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px;}
  .row{display:grid;grid-template-columns:60px 1fr 90px;align-items:center;gap:24px;}
  .tok{font-family:var(--font-ui);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-fg-2);}
  .bar{height:14px;background:#1F3A4D;}
  .px{font-family:var(--font-ui);font-size:12px;color:var(--color-fg);font-feature-settings:"lnum" 1;text-align:right;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="tok">xs</span><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><span class="tok">sm</span><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><span class="tok">md</span><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><span class="tok">lg</span><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><span class="tok">xl</span><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
  <div class="row"><span class="tok">2xl</span><div class="bar" style="width:128px"></div><div class="px">128 px</div></div>
</div></body></html>
