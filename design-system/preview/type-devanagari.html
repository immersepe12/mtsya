<!doctype html>
<html><head><meta charset="utf-8"><title>Devanagari</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:32px;display:flex;align-items:center;gap:48px;}
  .deva{font-family:var(--font-deva);font-weight:400;font-size:96px;line-height:1;color:var(--color-fg);}
  .meta{font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-fg-2);line-height:1.8;}
  .meta b{color:var(--color-fg);font-weight:500;display:block;font-family:var(--font-display);font-size:22px;letter-spacing:0;text-transform:none;margin-bottom:6px;}
  .meta i{font-family:var(--font-serif);font-style:italic;color:var(--color-fg-2);font-size:14px;letter-spacing:0;text-transform:none;}
</style></head>
<body><div class="wrap">
  <div class="deva">मत्स्य</div>
  <div class="meta">
    <b>matsya · the fish</b>
    Mukta Mahee · Ek Type Mumbai<br>
    For Devanagari only — never mix glyphs<br>
    <i>matsya — the first form, the keeper, the guide</i>
  </div>
</div></body></html>
