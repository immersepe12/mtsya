<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--color-bg);}
  .wrap{padding:32px;display:flex;flex-direction:column;gap:14px;}
  .word{font-family:var(--font-display);font-weight:700;font-size:88px;line-height:1;letter-spacing:.2em;color:var(--color-fg);}
  .meta{display:flex;gap:24px;font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--color-fg-2);}
  .meta b{color:var(--color-fg);font-weight:500;}
</style></head>
<body><div class="wrap">
  <div class="word">mtsya</div>
  <div class="meta">
    <div><b>EB Garamond Bold</b> · 64–96 px</div>
    <div><b>Tracking</b> +200 (0.2em)</div>
    <div><b>Lowercase</b> always</div>
    <div><b>Weight</b> 700</div>
  </div>
</div></body></html>
